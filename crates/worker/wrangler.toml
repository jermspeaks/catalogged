name = "catalogged"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"

[vars]
# Public R2 domain for covers (set after connecting the domain to the bucket). Empty = Worker serves /covers (local dev uses .dev.vars to override).
COVERS_BASE_URL = "https://covers.05152024.xyz"

[build]
command = "cargo install -q worker-build && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "catalogged"
database_id = "9a4c9c5c-dd9d-4f50-b6c6-a2cda8be6ced"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "COVERS"
bucket_name = "catalogged-covers"
