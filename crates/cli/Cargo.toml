[package]
name = "catalogged-cli"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "catalogged"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
catalogged-core = { path = "../core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
csv = "1.4.0"
dotenvy = "0.15.7"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "blocking"] }
serde = "1.0.229"
serde_json = "1.0.154"
webp = "0.3.1"
